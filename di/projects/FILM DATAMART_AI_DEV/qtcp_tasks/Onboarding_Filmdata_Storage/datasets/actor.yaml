properties:
  id: actor-cnvj
  name: actor
  inputDatasets:
    - datasetId: actor
      taskId: onboarding_filmdata_landing-cnvg
transformations:
  columnTransformations:
    - action: KEEP
      columnName: first_name
      newColumnName: first_name
      nullable: false
    - action: ADD
      columnName: full_name
      newDataType:
        type: STRING
      expression:
        expressionStatement: ${first_name} + ' ' + ${last_name}
        alias:
          - name: first_name
            value: first_name
          - name: last_name
            value: last_name
